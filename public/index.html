<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitoramento de Nível</title>

    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    

   <header class="topo">
    <h1>Monitoramento de Nível de Canal</h1>
    <div class="indicador-conexao">
        <span id="bolinhaStatus" class="bolinha"></span>
        <span id="textoConexao">Verificando...</span>
    </div>
</header>

    <main class="conteudo-principal">
        <div class="dashboard-grid">
            <section class="painel">
                <h3>Nível Atual</h3>
                <div class="velocimetro-wrapper">
                    <svg viewBox="0 0 200 130" class="velocimetro">
                        <defs>
                            <linearGradient id="gradBaixo" x1="0%" y1="100%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#14532d" />
                                <stop offset="100%" stop-color="#4ade80" />
                            </linearGradient>
                            <linearGradient id="gradMedio" x1="0%" y1="100%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#78350f" />
                                <stop offset="100%" stop-color="#fde047" />
                            </linearGradient>
                            <linearGradient id="gradAlto" x1="0%" y1="100%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#7c2d12" />
                                <stop offset="100%" stop-color="#fb923c" />
                            </linearGradient>
                            <linearGradient id="gradCritico" x1="0%" y1="100%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#7f1d1d" />
                                <stop offset="100%" stop-color="#f87171" />
                            </linearGradient>
                        </defs>

                        <path id="zonaBaixo"   class="zona" stroke="url(#gradBaixo)"   d="M 20 100 A 80 80 0 0 1 43.43 43.43" />
                        <path id="zonaMedio"   class="zona" stroke="url(#gradMedio)"   d="M 43.43 43.43 A 80 80 0 0 1 100 20" />
                        <path id="zonaAlto"    class="zona" stroke="url(#gradAlto)"    d="M 100 20 A 80 80 0 0 1 156.57 43.43" />
                        <path id="zonaCritico" class="zona" stroke="url(#gradCritico)" d="M 156.57 43.43 A 80 80 0 0 1 180 100" />

                        <line x1="28" y1="100" x2="12" y2="100" class="divisoria" />
                        <line x1="49.09" y1="49.09" x2="37.77" y2="37.77" class="divisoria" />
                        <line x1="100" y1="28" x2="100" y2="12" class="divisoria" />
                        <line x1="150.91" y1="49.09" x2="162.23" y2="37.77" class="divisoria" />
                        <line x1="172" y1="100" x2="188" y2="100" class="divisoria" />

                        <text x="20" y="70" class="rotulo">BAIXO</text>
                        <text x="64" y="15" class="rotulo">MÉDIO</text>
                        <text x="136" y="15" class="rotulo">ALTO</text>
                        <text x="180" y="70" class="rotulo">CRÍTICO</text>

                        <line id="ponteiro" x1="100" y1="100" x2="100" y2="30" />
                        <circle cx="100" cy="100" r="7" class="pino" />
                    </svg>
                    <p id="statusTexto" class="velocimetro-label">Carregando...</p>
                </div>
            </section>

            <section class="painel">
                <h3>Histórico</h3>
                <div class="grafico-wrapper">
                    <canvas id="graficoNivel" width="400" height="200"></canvas>
                </div>
                <div class="estatisticas-grid">
                    <div class="estatistica">
                        <span class="estatistica-label">Mínimo</span>
                        <span id="statMin" class="estatistica-valor">--</span>
                    </div>
                    <div class="estatistica">
                        <span class="estatistica-label">Máximo</span>
                        <span id="statMax" class="estatistica-valor">--</span>
                    </div>
                    <div class="estatistica">
                        <span class="estatistica-label">Média</span>
                        <span id="statMedia" class="estatistica-valor">--</span>
                    </div>
                </div>
            </section>
        </div>

        <div class="metadados-grid">
            <div class="metadado-card">
                <span class="metadado-label">Última atualização</span>
                <span id="metaUltimaAtualizacao" class="metadado-valor">--</span>
            </div>
        </div>
    </main>

    <script src="/script.js"></script>
</body>
</html>
